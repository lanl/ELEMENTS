# Build, test, and install on Windows: WARNING, does not work yet
name: Windows

on:
  workflow_dispatch:

jobs:
  build-test-install:
    strategy: 
      fail-fast: false
      matrix:
        build_type: [serial, openmp]
        # Windows typically uses the multi-config Visual Studio generator
        config: [Release] 
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with: 
        submodules: recursive

    - name: Install Fortran
      # Installs Intel oneAPI Fortran (ifx) which is compatible with MSVC
      uses: fortran-lang/setup-fortran@v1
      id: setup-fortran
      with:
        compiler: intel

    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install MPI
      # Intel MPI supports MPI-3.1+ on Windows
      uses: mpi4py/setup-mpi@v1
      with:
        mpi: intelmpi

    - name: Install Bison and Flex
      # Scotch requires Bison 3.0+; winflexbison3 provides this on Windows
      run: |
        choco install winflexbison3
        # Add to PATH so find_package(BISON) works
        echo "C:\ProgramData\chocolatey\bin" >> $GITHUB_PATH

    - name: Install Ninja
      run: choco install ninja

    - name: Configure CMake
      shell: pwsh
      run: |
        # Resolve absolute paths to the tools CMake needs
        # Use forward slashes to avoid backslash escape issues in CMake
        $fortran = (Get-Command ifx | Select-Object -First 1 -ExpandProperty Source) -replace '\\','/'
        $bison = (Get-Command win_bison | Select-Object -First 1 -ExpandProperty Source)
        $flex = (Get-Command win_flex | Select-Object -First 1 -ExpandProperty Source)

        $ninja = (Get-Command ninja | Select-Object -First 1 -ExpandProperty Source)

        cmake -G "Ninja" `
              -B build-${{matrix.build_type}} `
              -DCMAKE_MAKE_PROGRAM="$ninja" `
              -DCMAKE_BUILD_TYPE="${{ matrix.config }}" `
              -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" `
              -DCMAKE_C_COMPILER=cl `
              -DCMAKE_CXX_COMPILER=cl `
              -DCMAKE_Fortran_COMPILER="$fortran" `
              -DBUILD_PTSCOTCH=ON `
              -DSCOTCH_PTHREAD=OFF `
              -DCOMMON_PTHREAD=OFF `
              -DSCOTCH_PTHREAD_MPI=OFF `
              -DTHREADS_PREFER_PTHREAD_FLAG=OFF `
              -DELEMENTS_DEVICE_BACKEND="${{ matrix.build_type }}" `
              -DBISON_EXECUTABLE="$bison" `
              -DFLEX_EXECUTABLE="$flex" `
              -DBUILD_FORTRAN=ON

    - name: Build
      # Ninja is single-config; --config is ignored but harmless
      run: cmake --build build-${{matrix.build_type}} --config ${{matrix.config}}

    - name: Install
      run: cmake --install build-${{matrix.build_type}} --config ${{matrix.config}}