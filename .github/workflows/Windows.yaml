# Build, test, and install on Windows
name: Windows

on:
  push:
    branches: [master]
  pull_request: 
    branches: [master]

jobs:
  build-test-install:
    strategy: 
      fail-fast: false
      matrix:
        build_type: [serial, openmp]
        # Windows typically uses the multi-config Visual Studio generator
        config: [Release] 
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with: 
        submodules: true

    - name: Install Fortran
      # Installs Intel oneAPI Fortran (ifx) which is compatible with MSVC
      uses: fortran-lang/setup-fortran@v1
      id: setup-fortran
      with:
        compiler: intel

    - name: Install MPI
      # Intel MPI supports MPI-3.1+ on Windows
      uses: mpi4py/setup-mpi@v1
      with:
        mpi: intelmpi

    - name: Install Bison and Flex
      # Scotch requires Bison 3.0+; winflexbison3 provides this on Windows
      run: |
        choco install winflexbison3
        # Add to PATH so find_package(BISON) works
        echo "C:\ProgramData\chocolatey\bin" >> $GITHUB_PATH

    - name: Configure CMake
      shell: pwsh
      run: |
        # Resolve absolute paths to the tools CMake needs
        $fortran = (Get-Command ifx | Select-Object -First 1 -ExpandProperty Source)
        $bison = (Get-Command win_bison | Select-Object -First 1 -ExpandProperty Source)
        $flex = (Get-Command win_flex | Select-Object -First 1 -ExpandProperty Source)

        cmake -B build-${{matrix.build_type}} `
              -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" `
              -DCMAKE_Fortran_COMPILER="$fortran" `
              -DELEMENTS_ENABLE_SERIAL=ON `
              -DELEMENTS_ENABLE_OPENMP="${{ matrix.build_type == 'openmp' && 'ON' || 'OFF' }}" `
              -DBISON_EXECUTABLE="$bison" `
              -DFLEX_EXECUTABLE="$flex" `
              -DBUILD_FORTRAN=ON

    - name: Build
      # Windows (MSVC) is a multi-config generator, so --config is required
      run: cmake --build build-${{matrix.build_type}} --config ${{matrix.config}}

    - name: Install
      run: cmake --install build-${{matrix.build_type}} --config ${{matrix.config}}